name: Build Korean patch EXE
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile native runtime and one-file installer; run self-test
        run: python package.py
      - name: Check single versioned output
        shell: pwsh
        run: |
          $patchVersion = (Get-Content VERSION -Raw).Trim()
          $files = @(Get-ChildItem build/release -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "GalPapaKoreanPatch-v$patchVersion.exe") {
            throw 'Expected exactly one versioned patch EXE'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GalPapaKoreanPatch
          path: build/release/GalPapaKoreanPatch-v*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GalPapaKoreanPatch
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/GalPapaKoreanPatch-v*.exe
